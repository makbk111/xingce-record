name: Streamlit Keepalive
run-name: 保活Ping行测刷题工具
on:
  schedule:
    # UTC时间，每30分钟执行一次，稳妥安全，不建议小于20分钟
    - cron: '*/30 * * * *'
  # 支持手动点按钮触发测试
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: 访问streamlit链接保活
        run: |
          curl -s -m 20 https://xingce-record-njfderjmb79mb4cgjcpest.streamlit.app/ > /dev/null
